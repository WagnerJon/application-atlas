name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test storage, backup, and categories
        run: ./scripts/test.sh
      - name: Build native app
        run: ./scripts/build.sh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Package universal app
        env:
          ATLAS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/Application-Atlas-${RELEASE_TAG#v}-macOS-universal.zip" \
            dist/SHA256SUMS.txt dist/INSTALL.md dist/LICENSE \
            --verify-tag --title "Application Atlas $RELEASE_TAG" \
            --notes-file docs/RELEASE-NOTES.md
